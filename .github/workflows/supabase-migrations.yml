name: Apply Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Confirm applying pending migrations to the linked Supabase project
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Preview and apply approved migrations
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sécurité : l'historique distant et les fichiers locaux divergent, y compris
      # une collision de versions. Ne retirer ce verrou qu'après réconciliation
      # vérifiée sur staging et revue du plan de déploiement.
      - name: Bloquer les migrations jusqu'à réconciliation
        run: |
          echo "Migration bloquée : réconcilier les historiques local et distant avant tout déploiement. Voir docs/supabase-migrations.md." >&2
          exit 1

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Vérifier la configuration sans afficher les secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret" >&2; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret" >&2; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF variable" >&2; exit 1; }

      - name: Lier le projet Supabase attendu
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Afficher le statut et l'aperçu des migrations
        run: |
          supabase migration list --remote
          supabase db push --remote --skip-vault --dry-run

      - name: Appliquer les migrations confirmées
        run: supabase db push --remote --skip-vault --yes
