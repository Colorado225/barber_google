name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : les pushes successifs annulent l'ancien run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installation reproductible basée sur package-lock.json.
      - name: Installation des dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build

      - name: Mesure des bundles et temps de chargement (budget P2)
        run: npm run perf:report

      - name: Archive du build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            reports/bundle-metrics.json
          retention-days: 7

  supabase-migrations:
    name: Valider les migrations Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Démarrer Supabase local
        run: supabase start

      - name: Recréer la base avec toutes les migrations
        run: supabase db reset

      - name: Vérifier les migrations avec PostgreSQL Supabase
        run: supabase db lint
